<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Shadow League: War of the Rings - PvP Arena</title>
<style>
  body {
    margin: 0;
    background: linear-gradient(135deg, #0b0b0b, #1a1a1a);
    color: white;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    user-select: none;
  }
  header {
    background-color: #111;
    padding: 20px;
    text-align: center;
    font-size: 30px;
    font-weight: 900;
    letter-spacing: 2px;
    border-bottom: 3px solid #5a1a00;
    color: #ff6f00;
    text-shadow: 0 0 10px #ff6f00;
  }
  nav {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    background-color: #222;
    padding: 12px;
    border-bottom: 3px solid #5a1a00;
  }
  nav button {
    background-color: #333;
    color: #ff6f00;
    border: 2px solid #ff6f00;
    padding: 10px 18px;
    margin: 6px 10px;
    cursor: pointer;
    font-weight: bold;
    text-transform: uppercase;
    border-radius: 6px;
    transition: all 0.3s ease;
  }
  nav button:hover {
    background-color: #ff6f00;
    color: #111;
  }
  #gameArea {
    padding: 30px;
    max-width: 1000px;
    margin: auto;
    background: #1c1c1c;
    border-radius: 15px;
    box-shadow: 0 0 25px #ff6f00aa;
  }
  .panel {
    display: none;
  }
  .active {
    display: block;
  }

  /* PvP Arena layout */
  #pvp {
    text-align: center;
  }
  .players-container {
    display: flex;
    justify-content: space-around;
    margin-top: 30px;
  }
  .player-box {
    width: 45%;
    background: #2a2a2a;
    border: 3px solid #ff6f00;
    border-radius: 15px;
    padding: 20px;
    box-shadow: 0 0 15px #ff6f00cc inset;
    position: relative;
  }
  .player-name {
    font-size: 28px;
    font-weight: 900;
    color: #ffa726;
    margin-bottom: 15px;
    text-shadow: 0 0 6px #ff6f00;
  }

  .avatar {
    width: 100px;
    height: 100px;
    margin: 0 auto 15px auto;
    border-radius: 50%;
    background: #444;
    box-shadow: 0 0 15px #ff6f00;
    position: relative;
    overflow: hidden;
  }
  /* Simple elemental ring icons - colored circles */
  .ring-icon {
    display: inline-block;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    margin-right: 8px;
    vertical-align: middle;
    border: 2px solid #ff6f00;
    box-shadow: 0 0 8px #ff6f00;
  }
  .ring-Earth { background: #4caf50; }
  .ring-Magma { background: #e65100; }
  .ring-Fire { background: #d84315; }
  .ring-Air { background: #81d4fa; }
  .ring-Water { background: #0288d1; }
  .ring-Shadow { background: #6d4c41; }
  .ring-Void { background: #212121; border-color: #9c27b0; box-shadow: 0 0 12px #9c27b0; }

  /* Potion icons */
  .potion-icon {
    width: 28px;
    height: 40px;
    display: inline-block;
    margin-left: 8px;
    vertical-align: middle;
    background: linear-gradient(180deg, #90caf9, #42a5f5);
    border-radius: 8px 8px 4px 4px;
    position: relative;
    box-shadow: 0 0 8px #42a5f5;
  }
  .potion-Crystal\ Vision {
    background: linear-gradient(180deg, #b2ff59, #689f38);
    box-shadow: 0 0 10px #689f38;
  }
  .potion-Ash\ Cloak {
    background: linear-gradient(180deg, #ffab91, #bf360c);
    box-shadow: 0 0 10px #bf360c;
  }
  .potion-Void\ Flash {
    background: linear-gradient(180deg, #7e57c2, #311b92);
    box-shadow: 0 0 10px #311b92;
  }

  /* Health bars */
  .health-bar-container {
    background: #222;
    width: 100%;
    height: 25px;
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 10px;
  }
