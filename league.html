<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shadow League: War of the Rings - PvP Arena</title>
  <style>
    body {
      margin: 0;
      background-color: #0b0b0b;
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    header {
      background-color: #1a1a1a;
      padding: 20px;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      border-bottom: 2px solid #333;
    }
    nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-around;
      background-color: #111;
      padding: 10px;
      border-bottom: 2px solid #444;
    }
    nav button {
      background-color: #222;
      color: white;
      border: none;
      padding: 10px 15px;
      margin: 5px;
      cursor: pointer;
    }
    nav button:hover {
      background-color: #444;
    }
    #gameArea {
      padding: 20px;
    }
    .panel {
      display: none;
      margin-top: 20px;
      padding: 20px;
      background-color: #181818;
      border: 1px solid #333;
    }
    .active {
      display: block;
    }
    .health-bar-container {
      background: #333;
      width: 100%;
      height: 20px;
      border-radius: 5px;
      margin: 5px 0 15px 0;
    }
    .health-bar {
      height: 100%;
      background: #27ae60;
      width: 100%;
      border-radius: 5px;
      transition: width 0.3s ease;
    }
    .pvp-section {
      margin-bottom: 20px;
    }
    select, button {
      padding: 8px;
      margin: 5px 10px 10px 0;
      background: #222;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 3px;
    }
    select:hover, button:hover {
      background: #444;
    }
    #pvpLog {
      background: #222;
      height: 150px;
      overflow-y: auto;
      padding: 10px;
      border: 1px solid #555;
      white-space: pre-line;
      font-family: monospace;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <header>Shadow League: War of the Rings</header>
  <nav>
    <button onclick="showPanel('story')">Story</button>
    <button onclick="showPanel('stats')">Stats</button>
    <button onclick="showPanel('potions')">Potions</button>
    <button onclick="showPanel('dragons')">Dragons</button>
    <button onclick="showPanel('guild')">Guild</button>
    <button onclick="showPanel('combat')">Combat</button>
    <button onclick="showPanel('dex')">Index</button>
    <button onclick="showPanel('inventory')">Inventory</button>
    <button onclick="showPanel('map')">World Map</button>
    <button onclick="showPanel('pvp')">PvP Arena</button>
  </nav>

  <div id="gameArea">
    <!-- Other panels omitted for brevity; assume all previous panels here -->

    <div id="pvp" class="panel">
      <h2>PvP Arena</h2>
      <div class="pvp-section">
        <h3>Player 1 Setup</h3>
        <label for="p1Ring">Choose Ring:</label>
        <select id="p1Ring">
          <option value="Earth">Earth Ring</option>
          <option value="Magma">Magma Ring</option>
          <option value="Fire">Fire Ring</option>
          <option value="Air">Air Ring</option>
          <option value="Water">Water Ring</option>
          <option value="Shadow">Shadow Ring</option>
          <option value="Void">Void Ring</option>
        </select>
        <label for="p1Potion">Choose Potion:</label>
        <select id="p1Potion">
          <option value="None">None</option>
          <option value="Crystal Vision">Crystal Vision Potion</option>
          <option value="Ash Cloak">Ash Cloak Potion</option>
          <option value="Void Flash">Void Flash Elixir</option>
        </select>
      </div>

      <div class="pvp-section">
        <h3>Player 2 Setup</h3>
        <label for="p2Ring">Choose Ring:</label>
        <select id="p2Ring">
          <option value="Earth">Earth Ring</option>
          <option value="Magma">Magma Ring</option>
          <option value="Fire">Fire Ring</option>
          <option value="Air">Air Ring</option>
          <option value="Water">Water Ring</option>
          <option value="Shadow">Shadow Ring</option>
          <option value="Void">Void Ring</option>
        </select>
        <label for="p2Potion">Choose Potion:</label>
        <select id="p2Potion">
          <option value="None">None</option>
          <option value="Crystal Vision">Crystal Vision Potion</option>
          <option value="Ash Cloak">Ash Cloak Potion</option>
          <option value="Void Flash">Void Flash Elixir</option>
        </select>
      </div>

      <button onclick="startPvPCombat()">Start PvP Battle</button>

      <div style="margin-top:20px;">
        <h3>Player 1 Health</h3>
        <div class="health-bar-container"><div id="p1HealthBar" class="health-bar"></div></div>
        <h3>Player 2 Health</h3>
        <div class="health-bar-container"><div id="p2HealthBar" class="health-bar"></div></div>
      </div>

      <div id="pvpLog"></div>
    </div>
  </div>

  <script>
    // Helper for random int inclusive
    function randInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    // Basic stats setup
    function createPlayer(name, ring, potion) {
      // Base stats modified by ring and potion effects
      let baseStats = {
        health: 100,
        strength: 10,
        agility: 10,
        elementalPower: 10,
        shadowPower: 5,
      };

      // Rings boost elemental power or shadow power
      switch (ring) {
        case "Earth":
          baseStats.strength += 5; break;
        case "Magma":
          baseStats.elementalPower += 7; break;
        case "Fire":
          baseStats.elementalPower += 6; baseStats.agility += 2; break;
        case "Air":
          baseStats.agility += 6; break;
        case "Water":
          baseStats.health += 20; break;
        case "Shadow":
          baseStats.shadowPower += 10; baseStats.agility += 3; break;
        case "Void":
          baseStats.shadowPower += 15; baseStats.strength += 3; break;
      }

      // Potions grant special buffs
      if (potion === "Crystal Vision") {
        baseStats.agility += 5;
      } else if (potion === "Ash Cloak") {
        baseStats.health += 30;
      } else if (potion === "Void Flash") {
        baseStats.shadowPower += 7;
        baseStats.strength += 3;
      }

      return {
        name,
        ring,
        potion,
        health: baseStats.health,
        maxHealth: baseStats.health,
        strength: baseStats.strength,
        agility: baseStats.agility,
        elementalPower: baseStats.elementalPower,
        shadowPower: baseStats.shadowPower,
        isDefending: false
      };
    }

    let p1, p2;
    let currentTurn = 1; // 1 or 2
    let battleOngoing = false;

    function log(text) {
      const logDiv = document.getElementById("pvpLog");
      logDiv.innerText += text + "\n";
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    function updateHealthBars() {
      const p1HealthPercent = Math.max(0, (p1.health / p1.maxHealth) * 100);
      const p2HealthPercent = Math.max(0, (p2.health / p2.maxHealth) * 100);
      document.getElementById("p1HealthBar").style.width = p1HealthPercent + "%";
      document.getElementById("p2HealthBar").style.width = p2HealthPercent + "%";

      // Change colors if low health
      document.getElementById("p1HealthBar").style.backgroundColor = p1HealthPercent < 30 ? "#c0392b" : "#27ae60";
      document.getElementById("p2HealthBar").style.backgroundColor = p2HealthPercent < 30 ? "#c0392b" : "#27ae60";
    }

    function startPvPCombat() {
      if (battleOngoing) {
        alert("Battle already in progress!");
        return;
      }
      p1 = createPlayer("Player 1", document.getElementById("p1Ring").value, document.getElementById("p1Potion").value);
      p2 = createPlayer("Player 2", document.getElementById("p2Ring").value, document.getElementById("p2Potion").value);
      currentTurn = 1;
      battleOngoing = true;
      document.getElementById("pvpLog").innerText = "";
      log("Battle started! Player 1 vs Player 2");
      updateHealthBars();
      nextTurn();
    }

    function calculateDamage(attacker, defender) {
      // Base damage is strength + elementalPower + shadowPower
      let baseDamage = attacker.strength + attacker.elementalPower + attacker.shadowPower;

      // Agility affects chance to hit or dodge
      let hitChance = 75 + (attacker.agility - defender.agility) * 2; // base 75%
      hitChance = Math.min(95, Math.max(20, hitChance)); // Clamp between 20% and 95%

      if (Math.random() * 100 > hitChance) {
        return 0; // Missed attack
      }

      // Critical hit chance
      let critChance = 10 + attacker.agility * 0.5; // base 10%, + agility
      let crit = (Math.random() * 100 < critChance);
      let damage = baseDamage + randInt(5, 15);

      if (crit) {
        damage *= 1.5;
      }

      // Defending halves damage
      if (defender.isDefending) {
        damage /= 2;
      }

      return Math.floor(damage);
    }

    function nextTurn() {
      if (!battleOngoing) return;

      let attacker = currentTurn === 1 ? p1 : p2;
      let defender = currentTurn === 1 ? p2 : p1;

      // Randomly decide attack or defend
      // For demo: simple AI for Player 2, Player 1 is "human" and automatically attacks
      let action = "attack";

      if (currentTurn === 2) {
        action = Math.random() < 0.2 ? "defend" : "attack";
      }

      if (action === "defend") {
        attacker.isDefending = true;
        log(`${attacker.name} defends and prepares for the next attack.`);
      } else {
        attacker.isDefending = false;
        let damage = calculateDamage(attacker, defender);
        if (damage === 0) {
          log(`${attacker.name} attacks but misses!`);
        } else {
          defender.health -= damage;
          log(`${attacker.name} attacks with ${attacker.ring} + ${attacker.potion} for ${damage} damage!`);
          if (defender.health <= 0) {
            defender.health = 0;
            updateHealthBars();
            log(`${attacker.name} wins the battle!`);
            battleOngoing = false;
            return;
          }
        }
      }

      updateHealthBars();
      currentTurn = currentTurn === 1 ? 2 : 1;

      // Delay next turn for readability
      if (battleOngoing) {
        setTimeout(nextTurn, 1500);
      }
    }

    function showPanel(id) {
      document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
      document.getElementById(id).classList.add("active");
    }

    // Initialize on load: show Story panel
    window.onload = function () {
      showPanel("story");
    };
  </script>
</body>
</html>
